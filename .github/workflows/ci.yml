name: CI

# The deploy workflow is manual and only builds; this one is the quality gate
# every push and pull request has to pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same pinned npm as the deploy workflow: npm 10 crashes while preparing
      # AssetPicker's git dependency.
      - name: Use npm 11
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes the import-boundary rules)
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Type-check and production build
        run: npm run build
