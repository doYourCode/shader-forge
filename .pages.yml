# Pages CMS configuration
# https://pagescms.org/docs/configuration/
#
# Content is organised as parallel per-locale trees (see docs/i18n-content.md).
# Pages CMS does not resolve translations, so each locale gets its own
# collection and editors always see the tree for the locale they are editing.
# The runtime resolves/falls back in src/lib/ContentResolver.ts.

media:
  - name: content-images
    label: Content images
    input: public/images/content
    output: /images/content
    rename: safe
    extensions: [png, jpg, jpeg, webp, avif, gif, svg]

settings:
  content:
    # Preserve frontmatter keys that are not in the schema.
    merge: true
  commit:
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"

content:
  - name: docs_en
    label: Docs (English)
    type: collection
    path: content/en/docs
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      fields: [title, section, order, draft]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        description: One or two sentences for lists and future SEO.
      - name: section
        label: Section
        type: select
        required: true
        options:
          values:
            - name: api
              label: API Reference
            - name: guides
              label: Guides
      - name: order
        label: Order in section
        type: number
        options:
          min: 0
      - name: draft
        label: Draft
        type: boolean
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: content-images
          switcher: true

