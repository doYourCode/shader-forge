# Pages CMS configuration
# https://pagescms.org/docs/configuration/
#
# Content is organised as parallel per-locale trees (see docs/i18n-content.md).
# Pages CMS does not resolve translations, so each locale gets its own
# collection and editors always see the tree for the locale they are editing.
# The runtime resolves/falls back in src/core/content/ContentResolver.ts.
#
# The `section` values below must match SECTIONS in
# src/core/content/contentTrees.ts, and every frontmatter key the runtime reads
# must be declared here so the CMS can edit it. The lesson frontmatter contract
# is documented in content/en/docs/authoring-lessons.md.

media:
  - name: content-images
    label: Content images
    input: public/images/content
    output: /images/content
    rename: safe
    extensions: [png, jpg, jpeg, webp, avif, gif, svg]

settings:
  content:
    # Preserve frontmatter keys that are not in the schema.
    merge: true
  commit:
    templates:
      create: 'content(create): {path}'
      update: 'content(update): {path}'
      delete: 'content(delete): {path}'

# Shared lesson fields. Pages CMS has no YAML anchors, so each collection
# repeats them; keep the four blocks identical.
content:
  - name: docs_en
    label: Docs (English)
    type: collection
    path: content/en/docs
    format: yaml-frontmatter
    filename: '{primary}.md'
    subfolders: false
    view:
      fields: [title, section, order, difficulty, draft]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        description: One or two sentences for lists, search results and future SEO.
      - name: section
        label: Section
        type: select
        required: true
        options:
          values:
            - name: editors
              label: Editors
            - name: guides
              label: Guides
            - name: reference
              label: Reference
            - name: api
              label: API Reference
            - name: basics
              label: Shader Basics
            - name: math
              label: Math & Colour
            - name: glsl
              label: GLSL
            - name: lessons
              label: Lessons
            - name: lighting
              label: Lighting
            - name: post
              label: Post-processing
            - name: debugging
              label: Debugging & Performance
            - name: webgl
              label: 'WebGL & WebGPU'
      - name: order
        label: Order in section
        type: number
        options:
          min: 0
      - name: difficulty
        label: Difficulty
        type: select
        description: Shows a badge and drives the learning path. Leave empty for reference pages.
        options:
          values:
            - name: beginner
              label: Beginner
            - name: intermediate
              label: Intermediate
            - name: advanced
              label: Advanced
      - name: prerequisites
        label: Prerequisites
        type: string
        description: Comma-separated lesson slugs that should be read first.
      - name: editor
        label: Open in editor
        type: select
        description: Adds the "Open in editor" callout to this page.
        options:
          values:
            - name: editor
              label: 3D Shader Editor (/editor)
            - name: sandbox
              label: 2D Sandbox (/sandbox)
            - name: screen-space
              label: Screen Space Editor (/screen-space)
      - name: example
        label: Example id
        type: string
        description: Bundled example the callout loads (for example phong, gradient, gbuffer-normal).
      - name: printable
        label: Printable
        type: boolean
        description: Enables the print layout and the Print button (cheat sheets).
      - name: generated
        label: Generated
        type: boolean
        description: Set by npm run docs:abi. Do not edit this page by hand.
      - name: draft
        label: Draft
        type: boolean
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: content-images
          switcher: true

